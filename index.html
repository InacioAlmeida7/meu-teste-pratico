<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("banestes-theme");
          var hasStored = stored === "light" || stored === "dark";
          var theme = hasStored
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.content = hasStored ? stored : "light dark";
          }
        } catch (_err) {
          var fallback =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = fallback;
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portal web para consulta, filtragem, detalhamento e cadastro em memória de clientes bancários, contas e agências."
    />
    <title>Gestão de Clientes Bancários | Banestes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
